# Agregar DENTRO de los bloques server { } de /etc/nginx/sites-available/atalaya (ec2-frontend),
# ANTES de "location /api/ { ... }". Las rutas internas son solo para el agente, que habla
# directo con 10.0.128.10:3000 por el peering; desde internet no deben existir.
location ^~ /api/internal/ {
    return 404;
}
# Probar:  sudo nginx -t && sudo systemctl reload nginx
#          curl -sk -o /dev/null -w "%{http_code}\n" https://atalaya-zt.duckdns.org/api/internal/ids/feed   -> 404
